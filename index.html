<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="リンク集">
<meta name="theme-color" content="#ffffff">
<title>リンク集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 暗号化しない外側。学校名・会社名・リンクはここに書かない。
   方針: 白ベース、白／グレー／黒の帯でセクションを切り替え、強弱をつけて並べる(均等にしない) */
:root {
  --paper: #ffffff; --gray: #f3f3f0; --ink: #121212;
  --fg: #121212; --muted: #6d6d68; --line: #e3e3de; --surface: #f3f3f0;
  --accent: #1d5c47; --accent-soft: #e3eee9; --red: #c2381c;
  --jp: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --en: "Jost", "Zen Kaku Gothic New", "Helvetica Neue", Arial, sans-serif;
  --gutter: max(22px, env(safe-area-inset-left));
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--fg); font-family: var(--jp); font-size: 15px; line-height: 1.65;
  padding-bottom: env(safe-area-inset-bottom); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
main { min-height: 100vh; }

/* 合言葉 */
.lock { max-width: 340px; margin: 0 auto; padding: 22vh var(--gutter) 0; display: grid; gap: 14px; }
.lock .kicker { font-family: var(--en); font-size: 11px; letter-spacing: .22em; color: var(--muted); margin: 0; }
.lock h1 { font-size: 28px; margin: 0; letter-spacing: .02em; }
.lock label { font-size: 12.5px; color: var(--muted); }
.lock input { font: inherit; font-size: 16px; padding: 12px 18px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--fg); }
.lock button { font-family: var(--en); font-size: 14px; letter-spacing: .14em; font-weight: 500; padding: 12px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); }
.lock .msg { color: var(--red); font-size: 12.5px; min-height: 1.2em; }

/* 帯(セクション) */
.top, .band, .foot { padding-left: var(--gutter); padding-right: max(22px, env(safe-area-inset-right)); }
.top > *, .band > *, .foot > * { max-width: 620px; margin-left: auto; margin-right: auto; }
.top { padding-top: max(44px, env(safe-area-inset-top)); padding-bottom: 22px; }
.kicker { font-family: var(--en); font-size: 11px; letter-spacing: .24em; color: var(--muted); margin: 0 auto 10px; }
h1 { font-size: 36px; line-height: 1.12; letter-spacing: .02em; margin: 0 auto; font-weight: 700; }
.lead { font-size: 12.5px; color: var(--muted); margin: 12px auto 0; }

.toc { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding: 10px var(--gutter); background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding-top: max(10px, env(safe-area-inset-top)); }
.toc::-webkit-scrollbar { display: none; }
.toc a { flex: none; font-size: 12.5px; text-decoration: none; padding: 6px 13px; border-radius: 999px; background: var(--gray); color: var(--fg); font-weight: 500; }
.toc a:active { background: var(--ink); color: var(--paper); }

.band { padding-top: 40px; padding-bottom: 40px; scroll-margin-top: 50px; }
.band.tight { padding-top: 26px; padding-bottom: 30px; }
.band.white { background: var(--paper); }
.band.gray { background: var(--gray); --surface: #ffffff; --line: #dcdcd6; }
.band.dark { background: var(--ink); --fg: #f2f2ee; --muted: #a3a39d; --line: #2e2e2b; --surface: #1f1f1d; --accent-soft: #23362f; --accent: #8fd1b4; --red: #ff8a6b; color: var(--fg); }
.band + .band.white { border-top: 1px solid var(--line); }
.label { font-family: var(--en); font-size: 11px; letter-spacing: .22em; color: var(--muted); margin-top: 0; margin-bottom: 4px; }
h2 { font-size: 23px; line-height: 1.3; letter-spacing: .02em; margin-top: 0; margin-bottom: 18px; font-weight: 700; }

/* タグ */
.tag { display: inline-block; flex: none; font-size: 10.5px; line-height: 1; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-weight: 500; }

/* 主役(毎勤務) */
.hero { display: grid; gap: 6px; position: relative; text-decoration: none; padding: 20px 52px 20px 20px; margin-bottom: 10px;
  border: 1.5px solid var(--ink); border-radius: 18px; -webkit-tap-highlight-color: transparent; transition: transform .1s, background .1s; }
.hero .tag { justify-self: start; background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.hero b { font-size: 20px; line-height: 1.3; letter-spacing: .01em; }
.hero .desc { font-size: 12px; color: var(--muted); }
.hero .arrow { position: absolute; right: 20px; bottom: 18px; font-family: var(--en); font-size: 22px; }
.hero:active { transform: scale(.98); background: var(--gray); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { display: grid; gap: 2px; text-decoration: none; padding: 14px 14px 13px; border-radius: 14px; background: var(--gray); -webkit-tap-highlight-color: transparent; }
.mini b { font-size: 14px; line-height: 1.35; }
.mini span { font-size: 11px; color: var(--muted); }
.mini:active { background: var(--line); }

/* 細い行 */
.rows { border-top: 1px solid var(--line); }
.line { display: flex; align-items: center; gap: 10px; padding: 14px 2px; border-bottom: 1px solid var(--line); text-decoration: none; -webkit-tap-highlight-color: transparent; }
.line b { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; line-height: 1.4; }
.line::after { content: "↗"; font-family: var(--en); font-size: 14px; color: var(--muted); }
.line:active { background: var(--surface); }
.line.red b { color: var(--red); }
.line.red .tag { color: var(--red); border-color: currentColor; }

/* 欠勤 */
.rule { font-size: 14px; margin-top: -6px; margin-bottom: 18px; }
.rule em { font-style: normal; font-weight: 700; color: var(--red); }
.phone { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; padding: 16px 20px; margin-bottom: 14px; border-radius: 16px; background: var(--surface); }
.phone b { font-family: var(--en); font-size: 26px; font-weight: 500; letter-spacing: .04em; font-variant-numeric: tabular-nums; color: var(--red); }
.phone .tag { color: var(--fg); }
.sub { font-size: 12px; font-weight: 700; letter-spacing: .04em; margin-top: 26px; margin-bottom: 8px; color: var(--muted); }
dl.steps { display: grid; grid-template-columns: auto 1fr; margin-top: 0; margin-bottom: 10px; font-size: 13.5px; border-top: 1px solid var(--line); }
dl.steps dt, dl.steps dd { padding: 10px 0; border-bottom: 1px solid var(--line); margin: 0; }
dl.steps dt { font-family: var(--en); font-weight: 500; color: var(--accent); padding-right: 16px; white-space: nowrap; font-size: 13px; }
dl.steps a { text-decoration: underline; }

/* 折りたたみ・型 */
details.fold { border-bottom: 1px solid var(--line); }
.rows + details.fold, dl.steps + details.fold { margin-top: -10px; }
details.fold > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 2px; font-size: 13.5px; font-weight: 500; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-family: var(--en); font-size: 20px; line-height: 1; color: var(--muted); }
details.fold[open] > summary::after { content: "−"; }
details.fold[open] { padding-bottom: 14px; }
details.fold > * + * { margin-top: 10px; }
.tpl { position: relative; }
.tpl pre { margin: 0; font: inherit; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; background: var(--surface); border-radius: 12px; padding: 40px 16px 14px; }
.copy { position: absolute; top: 10px; right: 10px; font-family: var(--en); font-size: 11px; letter-spacing: .14em; font-weight: 500; padding: 5px 12px; border: 0; border-radius: 999px; background: var(--fg); color: var(--paper); }
.band.dark .copy { color: var(--ink); }
.note { font-size: 11.5px; color: var(--muted); margin-top: 10px; margin-bottom: 0; }
.note a { text-decoration: underline; }

/* チャンネル検索 */
#q { width: 100%; font: inherit; font-size: 16px; padding: 12px 20px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--fg); -webkit-appearance: none; }
#q:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 0; background: var(--gray); color: var(--fg); }
.count { font-family: var(--en); font-size: 11px; letter-spacing: .16em; color: var(--muted); margin-top: 18px; margin-bottom: 6px; }
.rows.ch .grp { font-family: var(--en); font-size: 10.5px; letter-spacing: .18em; color: var(--muted); padding: 16px 0 6px; border-bottom: 1px solid var(--line); }
.rows.ch .line { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 11px 2px; }
.rows.ch .line b { font-size: 14px; }
.rows.ch .line span { grid-column: 1; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.rows.ch .line::after { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.empty { font-size: 12.5px; color: var(--muted); padding: 14px 0; }

.foot { padding-top: 26px; padding-bottom: 40px; font-family: var(--en); font-size: 11px; letter-spacing: .08em; color: var(--muted); border-top: 1px solid var(--line); }
.foot > * { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.foot button { font: inherit; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; }
@media (prefers-reduced-motion: reduce) { .hero { transition: none; } }
</style>
</head>
<body>
<main id="app">
  <form class="lock" id="lock">
    <p class="kicker">LINKS</p>
    <h1>リンク集</h1>
    <label for="pass">合言葉を入れてください。この端末では次から入力しなくて済みます。</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button type="submit">OPEN</button>
    <div class="msg" id="msg" aria-live="polite"></div>
  </form>
</main>

const KEY = "mentor-links-key";
const $ = id => document.getElementById(id);
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
};
async function deriveRaw(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" }, base, 256);
}
async function decrypt(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(ENC.iv) }, key, unb64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function norm(s) {
  return (s || "").toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[#＃\s　・、。\-_]/g, "");
}
function open(data) {
  const app = $("app");

  document.title = data.title || "リンク集";
  app.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });

    const pre = $(b.dataset.copy), text = pre.textContent;
    const ok = () => { b.textContent = "COPIED"; setTimeout(() => b.textContent = "COPY", 1500); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "SELECTED"; };
    try { navigator.clipboard.writeText(text).then(ok, sel); } catch (e) { sel(); }
  }));
  const list = $("channels"), count = $("count"), q = $("q"), CH = data.channels;
  function render() {
    const terms = q.value.split(/[\s　]+/).map(norm).filter(Boolean);
    const hits = CH.filter(c => { const h = norm(c[1] + c[3] + c[4]); return terms.every(t => h.includes(t)); });
    list.textContent = "";
    let g = "";
    for (const c of hits) {
      if (c[0] !== g) { g = c[0]; const d = document.createElement("div"); d.className = "grp"; d.textContent = g.toUpperCase(); list.appendChild(d); }
      const a = document.createElement("a");
      a.className = "line"; a.href = data.ws + c[2]; a.target = "_blank"; a.rel = "noopener";
      const b = document.createElement("b"); b.textContent = c[1];
      const s = document.createElement("span"); s.textContent = c[3];
      a.append(b, s); list.appendChild(a);
    }
    if (!hits.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = "見つかりません。言葉を短くするか、#500-質問チャンネル で聞いてください。"; list.appendChild(d); }
    count.textContent = terms.length ? hits.length + " RESULTS" : CH.length + " CHANNELS";
  }
  q.addEventListener("input", render);
  app.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => { q.value = b.textContent; render(); }));
  render();
  const foot = app.querySelector(".foot");
  if (foot) { const f = document.createElement("button"); f.type = "button"; f.textContent = "この端末の合言葉を消す";
    f.addEventListener("click", () => { store.clear(); location.reload(); }); foot.firstElementChild.appendChild(f); }
}
$("lock").addEventListener("submit", async e => {
  e.preventDefault();
  $("msg").textContent = "確認しています…";
  try {
    const raw = await deriveRaw($("pass").value.normalize("NFKC").trim());
    const data = await decrypt(raw);
    store.set(tob64(raw)); open(data);
  } catch (err) { $("msg").textContent = "合言葉が違うようです。Slack のキャンバスにある合言葉を確かめてください。"; }
});
(async () => {
  if (!ENC) { $("msg").textContent = "データがありません。"; return; }
  const saved = store.get();
  if (saved) {
    try { open(await decrypt(unb64(saved))); return; }
    catch (e) { store.clear(); $("msg").textContent = "合言葉が変わりました。新しい合言葉を入れてください。"; }
  }
})();
</script>
