<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="リンク集">
<meta name="theme-color" content="#ffffff">
<title>リンク集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/yakuhanjp@4.1.1/dist/css/yakuhanjp_s.css">
<style>
/* 暗号化しない外側。学校名・会社名・リンクはここに書かない。
   手本: toshiyukihashimoto.jp の色・字体・ふわっと出る動き・画像の置き方。構成は A4(固定ヘッダー＋メニュー、影付きカード) */
:root {
  --black: #202220; --white: #ffffff; --gray: #ADADAD; --light: #EDEDED; --yellow: #F4FF7E; --line-yellow: #EAF33E;
  --fg: var(--black); --bg: var(--white); --muted: #5f615f; --line: #e2e2e0; --card: #ffffff; --shade: #d2d2cf;
  --hl: var(--yellow); --red: #c2381c;
  --r-l: 6px; --r-s: 2px;
  --ease-io: cubic-bezier(.35, .75, .1, 1);
  --jp: YakuHanJPs, "Inter Tight", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --en: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --gutter: max(20px, env(safe-area-inset-left));
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--jp); font-weight: 400; font-size: 15px; line-height: 1.6;
  letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
a { color: inherit; }
b, strong { font-weight: 600; }
:focus { outline: none; }
input:focus-visible, summary:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
main { min-height: 100vh; }

/* 合言葉 */
.lock { max-width: 340px; margin: 0 auto; padding: 22vh var(--gutter) 0; display: grid; gap: 14px; }
.lock .kicker { font-family: var(--en); font-size: 12px; font-weight: 600; color: var(--muted); margin: 0; }
.lock .kicker::before { content: "/ "; }
.lock h1 { font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
.lock label { font-size: 12.5px; color: var(--muted); }
.lock input { font: inherit; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--black); border-radius: var(--r-l); background: var(--white); color: var(--fg); }
.lock button { font-family: var(--en); font-size: 15px; font-weight: 600; padding: 12px; border: 0; border-radius: var(--r-l); background: var(--black); color: var(--white); }
.lock button:active { opacity: .85; }
.lock .msg { color: var(--red); font-size: 12.5px; min-height: 1.2em; }

/* 固定ヘッダー: 左上に文字のナビ(今いる所は網掛け)。触れると文字がさらっと入れ替わる */
.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 12px var(--gutter);
  background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; line-height: 1.55; letter-spacing: -.02em; }
.nav a { text-decoration: none; display: inline-block; padding: 0 1px; border-radius: var(--r-s); -webkit-tap-highlight-color: transparent; }
.nav a .w { position: relative; display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: 2px; }
.nav a .t { display: block; transition: translate .5s var(--ease-io); }
.nav a .w::before { content: attr(data-text); position: absolute; left: 0; top: 100%; transition: translate .5s var(--ease-io); }
.nav a .w::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: currentColor; scale: 0 1; transform-origin: right; transition: scale .5s var(--ease-io); }
.nav a.on { background: var(--yellow); }
.nav a.on .w::after { scale: 1 1; }
.nav a:active .t, .nav a:active .w::before { translate: 0 -100%; }
@media (hover: hover) {
  .nav a:hover .t, .nav a:hover .w::before { translate: 0 -100%; }
  .nav a:hover .w::after { scale: 1 1; transform-origin: left; }
}
.mark { flex: none; display: grid; justify-items: end; text-decoration: none; line-height: 1.2; padding-top: 2px; }
.mark b { font-size: 13px; }
.mark span { font-family: var(--en); font-size: 10.5px; font-weight: 600; color: var(--muted); }

/* 帯(セクション)。メニューで選んだ帯だけ表示 */
.band, .foot { padding-left: var(--gutter); padding-right: max(20px, env(safe-area-inset-right)); }
.band > *, .foot > * { max-width: 620px; margin-left: auto; margin-right: auto; }
.band { display: none; padding-top: 34px; padding-bottom: 48px; min-height: 70vh; }
.band.on { display: block; }
.band.white { background: var(--white); }
.band.gray { background: var(--light); --line: #d6d6d3; --shade: var(--gray); }
.band.dark { --soft: none; background: var(--black); --fg: #f5f5f3; --muted: var(--gray); --line: #3a3c3a; --card: #2b2d2b; --shade: #000; --hl: var(--yellow); --red: #ff8a6b; color: var(--fg); }
.label { font-family: var(--en); font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 0; margin-bottom: 6px; }
.label::before { content: "/ "; }
h2 { font-size: 38px; line-height: 1.15; letter-spacing: -.05em; margin-top: 0; margin-bottom: 24px; font-weight: 400; }

/* 説明(ボタンに見えないよう、枠を付けない文字にする) */
.tag { display: block; font-size: 12px; line-height: 1.5; color: var(--muted); font-weight: 500; }

/* 主役(毎勤務) */
.hero { display: grid; gap: 3px; position: relative; text-decoration: none; padding: 15px 46px 15px 18px; margin-bottom: 14px;
  border: 1px solid var(--black); border-radius: var(--r-l); background: var(--white); box-shadow: 0 1px 2px rgba(32,34,32,.04), 0 10px 24px -14px rgba(32,34,32,.22); -webkit-tap-highlight-color: transparent; }
.hero .tag { justify-self: start; font-size: 11.5px; font-weight: 500; color: var(--black); background: linear-gradient(transparent 55%, var(--hl) 55%); padding: 0 2px; }
.hero b { font-size: 18px; font-weight: 500; line-height: 1.3; letter-spacing: -.02em; }
.hero .desc { font-size: 12px; color: var(--muted); }
.hero .arrow { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-family: var(--en); font-size: 22px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.mini { display: grid; gap: 2px; text-decoration: none; padding: 14px 14px 13px; border-radius: var(--r-l); background: var(--light); -webkit-tap-highlight-color: transparent; }
.mini b { font-size: 14px; font-weight: 500; line-height: 1.35; }
.mini span { font-size: 11px; color: var(--muted); }

/* カード(行) */
.rows:not(.ch) { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1px 10px; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.line b { grid-column: 1; min-width: 0; font-size: 15px; font-weight: 500; line-height: 1.4; }
.line .tag { grid-column: 1; }
.line::after { content: "→"; grid-column: 2; grid-row: 1 / span 2; font-family: var(--en); font-size: 16px; color: var(--muted); }
.rows:not(.ch) .line { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px 16px; box-shadow: 0 1px 2px rgba(32,34,32,.04), 0 10px 24px -14px rgba(32,34,32,.22); }
.line.red b, .line.red .tag { color: var(--red); }
.rows:not(.ch) .line.red { border-left: 4px solid var(--red); }

/* 押せるもの: 黄色くしない。触れると少し浮き、名前の文字が下からさらっと入れ替わり、矢印が少し進む */
.hero, .mini, .rows:not(.ch) .line { transition: transform .5s var(--ease-io), box-shadow .5s var(--ease-io), background-color .3s ease; }
.hero .arrow, .line::after { transition: translate .5s var(--ease-io); }
.sw { position: relative; display: inline-block; overflow: hidden; vertical-align: bottom; max-width: 100%; }
.sw > span { display: block; transition: translate .5s var(--ease-io); }
.sw::before { content: attr(data-text); position: absolute; left: 0; top: 100%; white-space: nowrap; transition: translate .5s var(--ease-io); }
.hero:active .sw > span, .hero:active .sw::before, .mini:active .sw > span, .mini:active .sw::before,
.line:active .sw > span, .line:active .sw::before { translate: 0 -100%; }
.hero:active .arrow { translate: 4px 0; }
.line:active::after { translate: 3px 0; }
.rows.ch .line:active { background: var(--light); }
@media (hover: hover) {
  .hero:hover, .rows:not(.ch) .line:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(32,34,32,.04), 0 14px 30px -14px rgba(32,34,32,.28); }
  .mini:hover { transform: translateY(-2px); }
  .hero:hover .sw > span, .hero:hover .sw::before, .mini:hover .sw > span, .mini:hover .sw::before,
  .line:hover .sw > span, .line:hover .sw::before { translate: 0 -100%; }
  .hero:hover .arrow { translate: 4px 0; }
  .line:hover::after { translate: 3px 0; }
  .rows.ch .line:hover { background: var(--light); }
  .chips button:hover { background: var(--gray); }
}

/* 画像(img/ に置くと build.py が暗号化した本文に埋め込む) */
.shot { margin: 0 0 22px; }
.shot img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--r-l); background: var(--light); }
.shot.wide img { aspect-ratio: 16 / 9; }
.shot.offset { margin-left: 14%; }
.shot figcaption { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.shot figcaption::before { content: "/ "; font-family: var(--en); }

/* 欠勤 */
.rule { font-size: 14px; margin-top: -8px; margin-bottom: 18px; }
.rule em { font-style: normal; font-weight: 500; color: var(--black); background: var(--yellow); padding: 0 4px; border-radius: var(--r-s); }
.phone { display: grid; gap: 6px; text-decoration: none; padding: 16px 18px; margin-bottom: 14px; border-radius: var(--r-l); background: var(--card); }
.phone b { font-family: var(--en); font-size: 32px; font-weight: 500; white-space: nowrap; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--yellow); }
.phone .tag { color: var(--fg); font-weight: 500; }
.sub { font-size: 12px; font-weight: 500; margin-top: 28px; margin-bottom: 8px; color: var(--muted); }
dl.steps { display: grid; grid-template-columns: auto 1fr; margin-top: 0; margin-bottom: 10px; font-size: 13.5px; border-top: 1px solid var(--line); }
dl.steps dt, dl.steps dd { padding: 10px 0; border-bottom: 1px solid var(--line); margin: 0; }
dl.steps dt { font-weight: 500; padding-right: 16px; white-space: nowrap; font-size: 13px; }
.band.dark dl.steps dt { color: var(--yellow); }
dl.steps a { text-decoration: underline; }

/* 折りたたみ・型 */
details.fold { border-bottom: 1px solid var(--line); }
.rows:not(.ch) + details.fold { margin-top: 16px; border-top: 1px solid var(--line); }
dl.steps + details.fold { margin-top: -10px; }
details.fold > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 4px; font-size: 13.5px; font-weight: 500; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-family: var(--en); font-size: 18px; line-height: 1; color: var(--muted); transition: transform .3s var(--ease-io); }
details.fold[open] > summary::after { transform: rotate(45deg); }
details.fold[open] { padding-bottom: 14px; }
details.fold > * + * { margin-top: 10px; }
.tpl { position: relative; }
.tpl pre { margin: 0; font: inherit; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 40px 16px 14px; }
.copy { position: absolute; top: 10px; right: 10px; font-family: var(--en); font-size: 12px; font-weight: 600; padding: 5px 12px; border: 0; border-radius: var(--r-s); background: var(--fg); color: var(--bg); }
.band.dark .copy { background: var(--yellow); color: var(--black); }
.note { font-size: 11.5px; color: var(--muted); margin-top: 10px; margin-bottom: 0; }
.note a { text-decoration: underline; }

/* チャンネル検索 */
#q { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--black); border-radius: var(--r-l); background: var(--white); color: var(--fg); -webkit-appearance: none; }
#q:focus { outline: none; box-shadow: 0 0 0 3px var(--yellow); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; padding-bottom: 3px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; font: inherit; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: var(--r-s); border: 0; background: var(--light); color: var(--fg); }
.count { font-family: var(--en); font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 20px; margin-bottom: 6px; }
.count::before { content: "/ "; }
.rows.ch { border-top: 1px solid var(--line); }
.rows.ch .grp { font-family: var(--en); font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 16px 0 6px; border-bottom: 1px solid var(--line); }
.rows.ch .line { padding: 11px 6px; border-bottom: 1px solid var(--line); }
.rows.ch .line b { font-size: 14px; }
.rows.ch .line span { grid-column: 1; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.empty { font-size: 12.5px; color: var(--muted); padding: 14px 0; }

.foot { padding-top: 24px; padding-bottom: 40px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
.foot > * { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.foot button { font: inherit; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; }

/* 下に進むとふわっと出る */
.a-fade { opacity: 0; translate: 0 20px; }
.a-fade[data-shown="1"] { opacity: 1; translate: 0;
  transition: opacity 1.2s var(--ease-io) var(--d, 0s), translate 1.2s var(--ease-io) var(--d, 0s), transform .5s var(--ease-io), box-shadow .5s var(--ease-io), background-color .3s ease; }
@media (prefers-reduced-motion: reduce) {
  .a-fade, .a-fade[data-shown="1"] { translate: 0; }  /* 動きを減らす設定では、動かさずに薄く出すだけ */
  .a-fade[data-shown="1"] { transition: opacity .6s ease var(--d, 0s); }
  .hero, .mini, .rows .line, .sw > span, .sw::before, .nav a .t, .nav a .w::before, .nav a .w::after { transition: none; }
}

/* ===== 余白を広く・澄んだ白・英語見出し(2026-11-23 確定。上の指定を上書き) ===== */
:root { --line: #efefed; --muted: #707270; --card: #ffffff; --gutter: max(28px, env(safe-area-inset-left)); }
body { background: #ffffff; line-height: 1.8; letter-spacing: 0; }
.band, .band.white, .band.gray, .band.dark { background: #ffffff; --fg: var(--black); --muted: #707270; --line: #efefed; --card: #ffffff; --red: #c2381c; color: var(--fg); }
.band, .foot { padding-right: max(28px, env(safe-area-inset-right)); }
.band { padding-top: 72px; padding-bottom: 112px; min-height: 0; }
.band > * { max-width: 560px; }
.label { font-size: 11px; letter-spacing: .02em; margin-bottom: 18px; }
h2.en { font-family: var(--en); font-weight: 300; font-size: 30px; line-height: 1.05; letter-spacing: -.045em; margin-bottom: 10px; }
p.jp { font-size: 12px; color: var(--muted); margin: 0 0 56px; letter-spacing: .08em; }
/* ナビ: 参考サイトと同じ入れ替わり(元の文字が下から消え、下線つきの同じ文字が上から現れる) */
.bar { background: #ffffff; -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom: 1px solid #f3f3f1; padding-top: max(18px, env(safe-area-inset-top)); padding-bottom: 16px; }
.nav { font-size: 14px; font-weight: 500; line-height: 1.7; }
.nav a { padding: 0; background: none !important; border-radius: 0; }
.nav a .w { display: inline-grid; overflow: visible; padding: 0; }
.nav a .w::after { display: none; }
.nav a .t { grid-area: 1 / 1; clip-path: inset(0 0 0 0); translate: 0 0; transition: clip-path .4s var(--ease-io), translate .4s var(--ease-io); }
.nav a .w::before { content: attr(data-text); position: static; grid-area: 1 / 1; text-decoration: underline; text-underline-offset: .2em; text-decoration-thickness: 1px;
  clip-path: inset(100% 0 0 0); translate: 0 .1em; transition: clip-path .35s var(--ease-io), translate .4s var(--ease-io); }
.nav a.on .t { text-decoration: underline; text-underline-offset: .2em; text-decoration-thickness: 1px; }
.nav a:active .t, .nav a:active .w::before { translate: 0 0; }
.nav a:active .t { clip-path: inset(0 0 100% 0); translate: 0 .1em; }
.nav a:active .w::before { clip-path: inset(0 0 0 0); translate: 0 0; transition-delay: 75ms; }
@media (hover: hover) {
  .nav a:hover .t { clip-path: inset(0 0 100% 0); translate: 0 .1em; }
  .nav a:hover .w::before { clip-path: inset(0 0 0 0); translate: 0 0; transition: clip-path .45s var(--ease-io), translate .4s var(--ease-io); transition-delay: 75ms; }
}
/* カード → 枠も影もなく、細い線と余白だけで区切る */
.hero, .rows:not(.ch) .line, .mini { border: 0; border-radius: 0; box-shadow: none !important; background: transparent; }
.hero { padding: 26px 40px 26px 0; margin: 0; border-top: 1px solid var(--line); }
.hero + .hero { margin-top: 0; }
.hero b { font-size: 20px; font-weight: 400; letter-spacing: -.01em; }
.hero .tag { background: none; padding: 0; font-weight: 400; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
.hero .arrow { right: 0; font-size: 18px; font-weight: 300; }
.duo { margin-top: 0; gap: 0 24px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.mini { padding: 22px 0; }
.mini b { font-weight: 400; }
.rows:not(.ch) { gap: 0; border-top: 1px solid var(--line); }
.rows:not(.ch) .line { padding: 24px 0; border-bottom: 1px solid var(--line); }
.rows:not(.ch) .line.red { border-left: 0; }
.line b { font-weight: 400; font-size: 16px; }
.line::after { font-weight: 300; }
.hero:hover, .rows:not(.ch) .line:hover, .mini:hover { transform: none !important; }
.sw { display: inline-grid; overflow: visible; }
.sw > span { grid-area: 1 / 1; clip-path: inset(0 0 0 0); translate: 0 0; transition: clip-path .4s var(--ease-io), translate .4s var(--ease-io); }
.sw::before { position: static; grid-area: 1 / 1; white-space: normal; clip-path: inset(100% 0 0 0); translate: 0 .1em; transition: clip-path .35s var(--ease-io), translate .4s var(--ease-io); }
.hero:active .sw > span, .mini:active .sw > span, .line:active .sw > span { clip-path: inset(0 0 100% 0); translate: 0 .1em; }
.hero:active .sw::before, .mini:active .sw::before, .line:active .sw::before { clip-path: inset(0 0 0 0); translate: 0 0; transition-delay: 75ms; }
@media (hover: hover) {
  .hero:hover .sw > span, .mini:hover .sw > span, .line:hover .sw > span { clip-path: inset(0 0 100% 0); translate: 0 .1em; }
  .hero:hover .sw::before, .mini:hover .sw::before, .line:hover .sw::before { clip-path: inset(0 0 0 0); translate: 0 0; transition: clip-path .45s var(--ease-io), translate .4s var(--ease-io); transition-delay: 75ms; }
}
.sw::before { text-decoration: underline; text-underline-offset: .2em; text-decoration-thickness: 1px; }
/* 欠勤も白で。電話番号は黒の細字で大きく */
.phone { background: transparent; padding: 0; margin: 8px 0 36px; }
.phone b { color: var(--black); font-weight: 300; font-size: 40px; letter-spacing: -.04em; }
.phone .tag { font-weight: 400; color: var(--muted); }
.rule { margin-top: -36px; margin-bottom: 40px; }
.rule em { background: none; font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-yellow); text-decoration-thickness: .4em; text-underline-offset: -.25em; text-decoration-skip-ink: none; padding: 0; }
.sub { margin-top: 56px; margin-bottom: 14px; font-weight: 400; letter-spacing: .06em; }
dl.steps dt, dl.steps dd { padding: 16px 0; }
dl.steps dt { padding-right: 20px; }
dl.steps dt { font-weight: 500; color: var(--fg) !important; }
details.fold > summary { padding: 20px 0; font-weight: 400; }
.rows:not(.ch) + details.fold { margin-top: 0; border-top: 0; }
.tpl pre { background: #fafaf9; border-color: #f0f0ee; }
.band.dark .copy, .copy { background: var(--black); color: #fff; }
#q { border-width: 0 0 1px; border-radius: 0; padding: 12px 0; width: calc(100% - 20px); width: -webkit-fill-available; width: stretch; }
#q:focus { box-shadow: none; border-color: var(--black); }
.chips { margin-top: 16px; }
.chips button { background: transparent; border: 1px solid var(--line); border-radius: 999px; font-weight: 400; }
.count { margin-top: 40px; }
.rows.ch .line { padding: 16px 0; }
.rows.ch .line b { font-weight: 400; }
.note { margin-top: 20px; }
/* 1つずつ離して置く: うすい枠、間に余白。触れると枠と背景がほんのり濃くなる */
.hero, .rows:not(.ch) .line, .mini { border: 1px solid #ececea; border-radius: 6px; background: #ffffff; transition: background-color .3s ease, border-color .3s ease; }
.hero { padding: 16px 44px 16px 18px; margin: 0 0 14px; }
.hero .arrow { right: 18px; }
.hero b { font-size: 18px; }
.duo { border: 0; gap: 14px; margin-top: 0; }
.mini { padding: 14px 16px; }
.rows:not(.ch) { border-top: 0; gap: 14px; }
.rows:not(.ch) .line { padding: 15px 18px; }
.hero:active, .rows:not(.ch) .line:active, .mini:active { background: #fafaf9; border-color: #dcdcda; }
@media (hover: hover) { .hero:hover, .rows:not(.ch) .line:hover, .mini:hover { background: #fafaf9; border-color: #dcdcda; } }
.rows:not(.ch) + details.fold { margin-top: 20px; border-top: 1px solid var(--line); }
/* 電話番号: 大きすぎない大きさで、太字で目立たせる */
.phone b { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
.phone { margin: 0 0 28px; }
/* 段落: 見出し(番号・英語・日本語)は左端、その下の中身は一段下げる */
.band > :not(.label):not(h2):not(.jp) { margin-left: max(20px, calc(50% - 280px + 20px)); margin-right: max(0px, calc(50% - 280px)); max-width: none; }
.foot { padding-top: 40px; padding-bottom: 56px; border-top: 1px solid #f3f3f1; }

/* ===== ヘッダーなし: はじめの画面(概要と目次)＋右上の MENU(2026-11-23) ===== */
.menu-btn { position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); z-index: 30; display: flex; align-items: center; gap: 10px;
  background: none; border: 0; padding: 0; font-family: var(--en); font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--black); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.menu-btn .mb-t { text-decoration: underline; text-underline-offset: .35em; text-decoration-thickness: 1px; }
.menu-btn i { position: relative; width: 38px; height: 38px; border-radius: 6px; background: var(--black); }
.menu-btn i::before, .menu-btn i::after { content: ""; position: absolute; left: 11px; right: 11px; height: 1.5px; background: #fff; transition: transform .5s var(--ease-io); }
.menu-btn i::before { top: 15px; }
.menu-btn i::after { top: 22px; }
.menu-btn[aria-expanded="true"] i::before { transform: translateY(3.5px) rotate(45deg); }
.menu-btn[aria-expanded="true"] i::after { transform: translateY(-3.5px) rotate(-45deg); }
/* メニュー: 白い全画面。項目が上から順に流れて出る */
.menu { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; justify-content: center; max-height: none; overflow-y: auto; translate: 0;
  padding: 90px max(28px, env(safe-area-inset-right)) 40px max(28px, env(safe-area-inset-left)); background: #ffffff; border: 0; box-shadow: none; opacity: 0; visibility: hidden; transition: opacity .5s var(--ease-io), visibility 0s .5s; }
.menu.open { opacity: 1; visibility: visible; translate: 0; transition: opacity .5s var(--ease-io); }
.menu a { translate: -18px 0; }
.menu.open a { translate: 0; }
.menu a { display: grid; grid-template-columns: 30px 1fr; align-items: baseline; gap: 0 8px; padding: 11px 0; border-bottom: 1px solid var(--line); text-decoration: none;
  opacity: 0; translate: 0 14px; transition: opacity .6s var(--ease-io), translate .6s var(--ease-io); transition-delay: 0s; }
.menu.open a { opacity: 1; translate: 0; transition-delay: calc(var(--i, 0) * 55ms + 120ms); }
.menu a em { font-family: var(--en); font-style: normal; font-size: 11px; font-weight: 500; color: var(--muted); }
.menu a b { font-family: var(--en); font-weight: 300; font-size: 26px; line-height: 1.2; letter-spacing: -.04em; }
.menu a span { grid-column: 2; font-size: 11.5px; color: var(--muted); }
.menu a.on b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; }
@media (hover: hover) { .menu a:hover { background: none; } .menu a:hover b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; } }
/* はじめの画面 */
.band.home { padding-top: 112px; }
#home > * { margin-left: auto; margin-right: auto; max-width: 560px; }
.hero-t { font-size: 40px; font-weight: 300; line-height: 1.2; letter-spacing: -.02em; margin-top: 0; margin-bottom: 22px; }
.hero-lead { font-size: 13px; line-height: 1.95; color: var(--muted); margin-top: 0; margin-bottom: 52px; }
.idx { border-top: 1px solid var(--line); }
.idx a { display: grid; grid-template-columns: 30px 1fr auto; align-items: baseline; gap: 2px 8px; padding: 20px 0; border-bottom: 1px solid var(--line); text-decoration: none; -webkit-tap-highlight-color: transparent; }
.idx a em { font-family: var(--en); font-style: normal; font-size: 11px; font-weight: 500; color: var(--muted); }
.idx a b { font-family: var(--en); font-weight: 300; font-size: 22px; line-height: 1.2; letter-spacing: -.03em; }
.idx a span { grid-column: 2; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
.idx a::after { content: "→"; grid-column: 3; grid-row: 1; font-family: var(--en); font-weight: 300; color: var(--muted); transition: translate .4s var(--ease-io); }
.idx a:active::after { translate: 4px 0; }
@media (hover: hover) { .idx a:hover::after { translate: 4px 0; } .idx a:hover b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; } }
/* 切り替わり: ページごと下からふわっと入れ替わる。後ろに大きな薄い英字 */
.band.on { animation: pageIn .9s var(--ease-io) both; }
@keyframes pageIn { from { opacity: 0; translate: 0 28px; } to { opacity: 1; translate: 0 0; } }
.band { position: relative; overflow: hidden; }
.band[data-ghost]::before { content: attr(data-ghost); position: absolute; bottom: 6px; right: -6px; font-family: var(--en); font-weight: 300; font-size: 92px; line-height: 1;
  letter-spacing: -.06em; color: #f4f4f2; white-space: nowrap; pointer-events: none; z-index: 0; }
.band > * { position: relative; z-index: 1; }
.band.on { padding-top: 104px; }
.back { display: inline-block; margin-top: 64px; margin-bottom: 96px; font-family: var(--en); font-size: 12px; font-weight: 500; color: var(--muted); text-decoration: underline; text-underline-offset: .35em; text-decoration-thickness: 1px; }
@media (prefers-reduced-motion: reduce) { .band.on { animation-duration: .01s; } .menu a { transition: opacity .3s; translate: 0; } }

/* ===== 左の引き出しメニュー(2026-11-23) ===== */
.menu-btn { left: max(16px, env(safe-area-inset-left)); right: auto; flex-direction: row-reverse; }
.menu, .menu.open { inset: 0 auto 0 0; width: min(84vw, 380px); padding: 90px 28px 40px 30px; background: #ffffff; opacity: 1; visibility: visible; translate: 0;
  box-shadow: 1px 0 0 #ececea, 18px 0 40px -22px rgba(32,34,32,.28); transform: translateX(-100%); transition: transform .6s var(--ease-io); }
.menu.open { transform: translateX(0); }
.menu.dragging { transition: none; }
.menu { overflow-y: hidden; scrollbar-width: none; }
.menu.open { overflow-y: auto; }
.menu:not(.open):not(.dragging):not(.hint) { box-shadow: none; }
.menu::-webkit-scrollbar { display: none; }
/* 引き手: 左のふちの真ん中に小さな三角だけ。押せる範囲は広めにとる */
.pull { position: fixed; left: 0; top: 50%; z-index: 26; width: 26px; height: 56px; margin-top: -28px; padding: 0; border: 0; background: none; cursor: pointer;
  transition: opacity .3s ease, translate .5s var(--ease-io); -webkit-tap-highlight-color: transparent; }
.pull::before { content: ""; position: absolute; left: 0; top: 50%; margin-top: -7px; border-style: solid; border-width: 7px 0 7px 8px; border-color: transparent transparent transparent var(--black); }
.pull.hide { opacity: 0; translate: -100% 0; pointer-events: none; }
.menu.hint { animation: peek 1.6s var(--ease-io) .9s 1 both; }
@keyframes peek { 0%, 100% { transform: translateX(-100%); } 35%, 60% { transform: translateX(calc(-100% + 56px)); } }
.scrim { position: fixed; inset: 0; z-index: 24; background: rgba(32,34,32,.22); opacity: 0; visibility: hidden; transition: opacity .5s var(--ease-io), visibility 0s .5s; }
.scrim.open { opacity: 1; visibility: visible; transition: opacity .5s var(--ease-io); }
@media (prefers-reduced-motion: reduce) { .menu.hint { animation: none; } }
</style>
</head>

const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
};
async function deriveRaw(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" }, base, 256);
}
async function decrypt(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(ENC.iv) }, key, unb64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function norm(s) {
  return (s || "").toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[#＃\s　・、。\-_]/g, "");
}
// 下に進むとふわっと出る(動きを減らす設定の端末では、動かさずに薄く出すだけ)
const REVEAL = ".label, h1, .hero-lead, .idx > a, h2, .shot, .hero, .duo, .rows:not(.ch) > .line, .phone, .rule, .sub, dl.steps, details.fold, #q, .chips";
const io = ("IntersectionObserver" in window)
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.dataset.shown = "1"; io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" })
  : null;
function reveal(band) {
  if (!io) return;
  band.querySelectorAll(REVEAL).forEach((el, i) => {
    el.classList.add("a-fade"); el.dataset.shown = "0";
    el.style.setProperty("--d", Math.min(i, 6) * 0.06 + "s");
    io.observe(el);
  });
}
function slide(el) {  // 名前の文字を包み、触れると下から同じ文字がさらっと出るようにする
  const t = el.textContent; const w = document.createElement("span"); w.className = "sw"; w.dataset.text = t;
  const i = document.createElement("span"); i.textContent = t; w.appendChild(i); el.textContent = ""; el.appendChild(w);
}
function open(data) {
  const app = $("app");
  app.innerHTML = data.html;
  document.title = data.title || "リンク集";
  app.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  app.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
    const pre = $(b.dataset.copy), text = pre.textContent;
    const ok = () => { b.textContent = "COPIED"; setTimeout(() => b.textContent = "COPY", 1500); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "SELECTED"; };
    try { navigator.clipboard.writeText(text).then(ok, sel); } catch (e) { sel(); }
  }));
  app.querySelectorAll(".hero > b, .mini > b, .rows:not(.ch) .line > b").forEach(slide);
  const list = $("channels"), count = $("count"), q = $("q"), CH = data.channels;
  function render() {
    const terms = q.value.split(/[\s　]+/).map(norm).filter(Boolean);
    const hits = CH.filter(c => { const h = norm(c[1] + c[3] + c[4]); return terms.every(t => h.includes(t)); });
    list.textContent = "";
    let g = "";
    for (const c of hits) {
      if (c[0] !== g) { g = c[0]; const d = document.createElement("div"); d.className = "grp"; d.textContent = g.toUpperCase(); list.appendChild(d); }
      const a = document.createElement("a");
      a.className = "line"; a.href = data.ws + c[2]; a.target = "_blank"; a.rel = "noopener";
      const b = document.createElement("b"); b.textContent = c[1]; slide(b);
      const s = document.createElement("span"); s.textContent = c[3];
      a.append(b, s); list.appendChild(a);
    }
    if (!hits.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = "見つかりません。言葉を短くするか、#500-質問チャンネル で聞いてください。"; list.appendChild(d); }
    count.textContent = terms.length ? hits.length + " RESULTS" : CH.length + " CHANNELS";
  }
  q.addEventListener("input", render);
  app.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => { q.value = b.textContent; render(); }));
  render();
  // はじめの画面＋右上の MENU: 選んだページだけを表示する
  const menu = $("menu"), btn = $("menu-btn"), bands = [...app.querySelectorAll(".band")];
  const links = [...app.querySelectorAll('a[href^="#"]')].filter(a => bands.some(b => "#" + b.id === a.getAttribute("href")));
  [...menu.querySelectorAll("a")].forEach((a, i) => a.style.setProperty("--i", i));
  bands.forEach(b => {
    const h = b.querySelector("h2.en"); if (!h) return;
    b.dataset.ghost = h.textContent;
    const k = document.createElement("a"); k.className = "back"; k.href = "#home"; k.textContent = "← Index"; b.appendChild(k); links.push(k);
  });
  const scrim = document.createElement("div"); scrim.className = "scrim"; app.appendChild(scrim);
  const HINT = "mentor-links-menu-seen";
  const pull = document.createElement("button"); pull.type = "button"; pull.className = "pull"; pull.setAttribute("aria-label", "目次を開く");
  pull.addEventListener("click", () => toggle(true)); app.appendChild(pull);
  function toggle(on) {
    menu.classList.remove("hint");
    menu.classList.toggle("open", on); scrim.classList.toggle("open", on); pull.classList.toggle("hide", on); btn.setAttribute("aria-expanded", on ? "true" : "false");
    btn.querySelector(".mb-t").textContent = on ? "CLOSE" : "MENU"; document.body.style.overflow = on ? "hidden" : "";
    if (on) { try { localStorage.setItem(HINT, "1"); } catch (e) {} }
  }
  function show(id) {
    if (!bands.some(b => b.id === id)) id = bands[0].id;
    bands.forEach(b => b.classList.toggle("on", b.id === id));
    menu.querySelectorAll("a").forEach(t => {
      const on = t.getAttribute("href") === "#" + id;
      t.classList.toggle("on", on);
      if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    reveal(bands.find(b => b.id === id));
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
  }
  btn.addEventListener("click", () => toggle(btn.getAttribute("aria-expanded") !== "true"));
  // スマホ: 指に合わせて左から引き出す(左右の端 16px は iPhone の「戻る」と重なるので使わない)
  scrim.addEventListener("click", () => toggle(false));
  menu.addEventListener("click", e => { if (!menu.classList.contains("open") && e.target === menu) toggle(true); });
  const W = () => menu.getBoundingClientRect().width;
  let sx = 0, sy = 0, dx = 0, base = 0, drag = false, decided = false;
  addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { drag = false; return; }
    const t = e.touches[0], open = menu.classList.contains("open");
    sx = t.clientX; sy = t.clientY; dx = 0; decided = false;
    drag = !e.target.closest("input, .chips, pre") && (open || e.target === pull || (sx > 16 && sx < innerWidth - 16));
    base = open ? 0 : -W();
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (!drag) return;
    const t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
    if (!decided) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      decided = true;
      if (Math.abs(my) > Math.abs(mx) || (!menu.classList.contains("open") && mx < 0)) { drag = false; return; }
      menu.classList.remove("hint"); menu.classList.add("dragging"); pull.classList.add("hide");
    }
    e.preventDefault();
    dx = mx;
    const x = Math.min(0, Math.max(-W(), base + dx));
    menu.style.transform = "translateX(" + x + "px)";
    scrim.style.visibility = "visible"; scrim.style.opacity = String(1 + x / W());
  }, { passive: false });
  addEventListener("touchend", () => {
    if (!drag || !decided) { drag = false; return; }
    drag = false; menu.classList.remove("dragging"); menu.style.transform = ""; scrim.style.opacity = ""; scrim.style.visibility = "";
    const open = menu.classList.contains("open");
    if (!open && dx > 60) toggle(true); else if (open && dx < -60) toggle(false); else toggle(open);
  }, { passive: true });
  // まだ一度もメニューを開いていない端末では、はじめに一度だけ少し出して戻す
  let seen = false; try { seen = localStorage.getItem(HINT) === "1"; } catch (e) {}
  if (!seen) menu.classList.add("hint");
  addEventListener("keydown", e => { if (e.key === "Escape") toggle(false); });
  links.forEach(t => t.addEventListener("click", e => { e.preventDefault(); toggle(false); scrollTo(0, 0); show(t.getAttribute("href").slice(1)); }));
  show(location.hash.slice(1));
  const foot = app.querySelector(".foot");
  if (foot) { const f = document.createElement("button"); f.type = "button"; f.textContent = "この端末の合言葉を消す";
    f.addEventListener("click", () => { store.clear(); location.reload(); }); foot.firstElementChild.appendChild(f); }
}
$("lock").addEventListener("submit", async e => {
  e.preventDefault();
  $("msg").textContent = "確認しています…";
  try {
    const raw = await deriveRaw($("pass").value.normalize("NFKC").trim());
    const data = await decrypt(raw);
    store.set(tob64(raw)); open(data);
  } catch (err) { $("msg").textContent = "合言葉が違うようです。Slack のキャンバスにある合言葉を確かめてください。"; }
});
(async () => {
  if (!ENC) { $("msg").textContent = "データがありません。"; return; }
  const saved = store.get();
  if (saved) {
    try { open(await decrypt(unb64(saved))); return; }
    catch (e) { store.clear(); $("msg").textContent = "合言葉が変わりました。新しい合言葉を入れてください。"; }
  }
})();
</script>
</body>
</html>
